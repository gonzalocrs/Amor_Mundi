<!doctype html><html><head><meta charset="utf-8"><style>@page{size:17in 11in;margin:0}html,body{margin:0}svg{display:block;width:17in;height:11in}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="431.8mm" height="279.4mm" viewBox="0 0 431.8 279.4" font-family="Arial, Helvetica, sans-serif"><defs><pattern id="conc" width="1.6" height="1.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="1.6" stroke="#000" stroke-width="0.14"/></pattern><pattern id="earth" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="2.4" stroke="#777" stroke-width="0.12"/></pattern><pattern id="cast" width="1.6" height="1.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="1.6" stroke="#000" stroke-width="0.14"/><line x1="0" y1="0" x2="1.6" y2="0" stroke="#000" stroke-width="0.14"/></pattern></defs><rect width="431.8" height="279.4" fill="#fff"/><text x="16.00" y="19.00" font-size="8.2" font-weight="bold" font-style="normal" text-anchor="start" fill="#000">STRUCTURAL ANALYSIS</text><line x1="6.00" y1="26.50" x2="429.80" y2="26.50" stroke="#000" stroke-width="0.45"/><text x="17.00" y="41.00" font-size="6.4" font-weight="bold" font-style="normal" text-anchor="start" fill="#000">05</text><text x="29.00" y="41.00" font-size="6.4" font-weight="bold" font-style="normal" text-anchor="start" fill="#000">RINGS, COLUMNS AND FOOTINGS</text><text x="29.00" y="48.50" font-size="2.9" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">The base ring ties the foot thrust of the ribs (tension), the crown ring gathers them at the top (compression). Columns carry the ring to the rectangular strip footing; footing checked by hand from the Karamba reactions.</text><text x="17.00" y="59.00" font-size="4.0" font-weight="bold" font-style="normal" text-anchor="start" fill="#000">A · 15X10</text><text x="43.05" y="59.00" font-size="3.0" font-weight="normal" font-style="italic" text-anchor="start" fill="#000"></text><text x="16.00" y="68.00" font-size="3.0" font-weight="bold" font-style="normal" text-anchor="start" fill="#000">BASE RING 52.8 x 40 (TIE), HAND CHECK AGAINST KARAMBA</text><text x="16.00" y="73.00" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">Outward foot thrust of the ribs (LONG): H = 312 kN on a ring perimeter of 43.2 m: q = 7.2 kN/m.</text><text x="16.00" y="77.20" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">Hoop tension, ring taken as a circle of the same perimeter: r = 6.88 m, T = q r = 7.2 x 6.88 = 50 kN.</text><text x="16.00" y="81.40" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">Karamba: N = +35 to +88 kN LONG, up to +108 kN SHORT (tension all round); M up to 27.6 kNm (resultant of My and Mz, W-Y).</text><text x="16.00" y="85.60" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">The ring also ties what the printed pieces push out, so Karamba is above the rib-only hand value.</text><text x="16.00" y="89.80" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">Bars for the tension: As = 88 kN / 215 MPa = 411 mm2 long-term, 108 / 345 = 312 mm2 short-term; 8D16 = 1,592 mm2.</text><text x="16.00" y="97.00" font-size="3.0" font-weight="bold" font-style="normal" text-anchor="start" fill="#000">CROWN RING 25 x 25 (COMPRESSION)</text><text x="16.00" y="102.00" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">Inward push of the rib heads (LONG): H = 10 kN; the ribs also hold the ring up, V = 17 kN.</text><text x="16.00" y="106.20" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">Karamba: N = -4.9 to -0.9 kN LONG, -12.9 to +5.0 kN SHORT; sigma max 3.7 MPa = 15 % of 24 MPa.</text><text x="16.00" y="113.40" font-size="3.0" font-weight="bold" font-style="normal" text-anchor="start" fill="#000">COLUMNS 42 (radial) x 36, 20 IN KARAMBA, +-0.00 TO +2.00</text><text x="16.00" y="118.40" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">By hand: weight 1742 kN / 20 columns = 87 kN each; Karamba LONG 77 to 99 kN (the long sides carry more).</text><text x="16.00" y="122.60" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">Karamba: N = -108 to -68 kN LONG, -137 to -42 kN SHORT; M up to 34.2 kNm (SHORT).</text><text x="16.00" y="126.80" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">sigma = N/A + M/W: 2.1 MPa LONG (18 %), 5.6 MPa SHORT (23 %), governing case W45.</text><text x="16.00" y="134.00" font-size="3.0" font-weight="bold" font-style="normal" text-anchor="start" fill="#000">RECTANGULAR STRIP FOOTING 120 x 50, SQUARE CORNER BLOCKS, BASE -0.80, HAND CHECK</text><text x="16.00" y="139.00" font-size="2.4" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">Straight strips on the side column lines, outside 16.38 x 11.27 m; corner blocks 2.36 x 2.03 m under the corner columns. Each column on 2.52 m of strip.</text><text x="16.00" y="143.00" font-size="2.4" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">N = reaction + strip + soil; M = reaction moment + H x 0.80, plus N x the column's offset from the strip axis (up to 0.14 m). Effective-area bearing; continuity not counted.</text><text x="16.00" y="149.00" font-size="2.5" font-weight="bold" font-style="normal" text-anchor="start" fill="#000"></text><text x="32.00" y="149.00" font-size="2.5" font-weight="bold" font-style="normal" text-anchor="start" fill="#000">BEARING q max / allowable</text><text x="98.00" y="149.00" font-size="2.5" font-weight="bold" font-style="normal" text-anchor="start" fill="#000">TIPPING FS</text><text x="132.00" y="149.00" font-size="2.5" font-weight="bold" font-style="normal" text-anchor="start" fill="#000">SLIDING FS (mu 0.5)</text><line x1="16.00" y1="150.30" x2="172.00" y2="150.30" stroke="#000" stroke-width="0.2"/><text x="16.00" y="153.60" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">LONG</text><text x="32.00" y="153.60" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">76 kPa / 200 (38 %), LIVEY</text><text x="98.00" y="153.60" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">3.0 (LIVEY)</text><text x="132.00" y="153.60" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">5.8 (LIVEY)</text><text x="16.00" y="157.60" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">SHORT</text><text x="32.00" y="157.60" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">142 kPa / 400 (35 %), W+X</text><text x="98.00" y="157.60" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">1.5 (W+X)</text><text x="132.00" y="157.60" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">2.3 (W-Y)</text><line x1="16.00" y1="159.00" x2="172.00" y2="159.00" stroke="#000" stroke-width="0.15"/><text x="16.00" y="162.60" font-size="2.4" font-weight="bold" font-style="normal" text-anchor="start" fill="#000">Required: tipping FS = N (B/2) / M &gt;= 1.5, sliding FS = 0.5 N / H &gt;= 1.5. Bearing OK, tipping NOT OK, sliding OK.</text><text x="16.00" y="166.60" font-size="2.4" font-weight="normal" font-style="normal" text-anchor="start" fill="#b03a2e">Tipping is short of 1.5 (min 1.49); a 1.25 m wide strip gives 1.5.</text><text x="224.90" y="59.00" font-size="4.0" font-weight="bold" font-style="normal" text-anchor="start" fill="#000">B · 10X10</text><text x="250.95" y="59.00" font-size="3.0" font-weight="normal" font-style="it 2.5 MPa = 10 % of 24 MPa.</text><text x="223.90" y="113.40" font-size="3.0" font-weight="bold" font-style="normal" text-anchor="start" fill="#000">COLUMNS 36.2 (radial) x 30, 16 IN KARAMBA, +-0.00 TO +2.00</text><text x="223.90" y="118.40" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">By hand: weight 931 kN / 16 columns = 58 kN each; Karamba LONG 55 to 62 kN (the long sides carry more).</text><text x="223.90" y="122.60" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">Karamba: N = -67 to -49 kN LONG, -82 to -35 kN SHORT; M up to 15.7 kNm (SHORT).</text><text x="223.90" y="126.80" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">sigma = N/A + M/W: 1.5 MPa LONG (12 %), 4.5 MPa SHORT (19 %), governing case W45.</text><text x="223.90" y="134.00" font-size="3.0" font-weight="bold" font-style="normal" text-anchor="start" fill="#000">RECTANGULAR STRIP FOOTING 85 x 50, SQUARE CORNER BLOCKS, BASE -0.80, HAND CHECK</text><text x="223.90" y="139.00" font-size="2.4" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">Straight strips on the side column lines, outside 10.99 x 10.99 m; corner blocks 1.73 x 1.73 m under the corner columns. Each column on 2.53 m of strip.</text><text x="223.90" y="143.00" font-size="2.4" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">N = reaction + strip + soil; M = reaction moment + H x 0.80, plus N x the column's offset from the strip axis (up to 0.04 m). Effective-area bearing; continuity not counted.</text><text x="223.90" y="149.00" font-size="2.5" font-weight="bold" font-style="normal" text-anchor="start" fill="#000"></text><text x="239.90" y="149.00" font-size="2.5" font-weight="bold" font-style="normal" text-anchor="start" fill="#000">BEARING q max / allowable</text><text x="305.90" y="149.00" font-size="2.5" font-weight="bold" font-style="normal" text-anchor="start" fill="#000">TIPPING FS</text><text x="339.90" y="149.00" font-size="2.5" font-weight="bold" font-style="normal" text-anchor="start" fill="#000">SLIDING FS (mu 0.5)</text><line x1="223.90" y1="150.30" x2="379.90" y2="150.30" stroke="#000" stroke-width="0.2"/><text x="223.90" y="153.60" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">LONG</text><text x="239.90" y="153.60" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">67 kPa / 200 (33 %), LIVEY</text><text x="305.90" y="153.60" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">3.1 (LIVEY)</text><text x="339.90" y="153.60" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">9.3 (LIVEX)</text><text x="223.90" y="157.60" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">SHORT</text><text x="239.90" y="157.60" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">137 kPa / 400 (34 %), EQY</text><text x="305.90" y="157.60" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">1.4 (EQY)</text><text x="339.90" y="157.60" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">3.7 (W+Y)</text><line x1="223.90" y1="159.00" x2="379.90" y2="159.00" stroke="#000" stroke-width="0.15"/><text x="223.90" y="162.60" font-size="2.4" font-weight="bold" font-style="normal" text-anchor="start" fill="#000">Required: tipping FS = N (B/2) / M &gt;= 1.5, sliding FS = 0.5 N / H &gt;= 1.5. Bearing OK, tipping NOT OK, sliding OK.</text><text x="223.90" y="166.60" font-size="2.4" font-weight="normal" font-style="normal" text-anchor="start" fill="#b03a2e">Tipping is short of 1.5 (min 1.44); a 0.90 m wide strip gives 1.5.</text><text x="16.00" y="269.40" font-size="2.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">Soil bearing 200 k
